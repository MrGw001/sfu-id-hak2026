version: '3.8'

services:
  sfu-backend:
    build: .
    container_name: sfu_fastapi_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://sfu_redis:6379/0
      - APP_ENV=production
    depends_on:
      - sfu_redis

  sfu_redis:
    image: redis:7.2-alpine
    container_name: sfu_redis_cache
    restart: always
    ports:
      - "6379:6379"

volumes:
  redis_data:
