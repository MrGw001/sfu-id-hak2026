version: '3.8'

services:
  sfu-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sfu_portal_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "80:80"
    environment:
      - NODE_ENV=production

  sfu-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sfu_fastapi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://sfu_redis:6379/0
      - APP_ENV=production
    depends_on:
      - sfu_redis

  sfu_redis:
    image: redis:7.2-alpine
    container_name: sfu_redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
